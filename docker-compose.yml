version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:latest
    container_name: zuccano_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: zuccano_admin
      MONGO_INITDB_ROOT_PASSWORD: zuccano_secret_password
      MONGO_INITDB_DATABASE: zuccano_db
    volumes:
      - mongo_data:/data/db

  # Python FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zuccano_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=Zuccano API
      - ENVIRONMENT=development
      - MONGODB_URL=mongodb://zuccano_admin:zuccano_secret_password@mongodb:27017/zuccano_db?authSource=admin
      - DATABASE_NAME=zuccano_db
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app

  # React Frontend (Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zuccano_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mongo_data:
    driver: local
